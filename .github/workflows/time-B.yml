name: optcd-time-B

on:
- workflow_dispatch

jobs:
  ubuntu_build:
    runs-on:
    - self-hosted
    - optcd
    strategy:
      matrix:
        java:
        - 8
    steps:
    - uses: actions/checkout@v4
    - name: Setup java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: "zulu"
        cache: "maven"
    - name: 'mvn: go-offline (untimed)'
      run: mvn -B -q dependency:go-offline || true
    - name: 'mvn: Build with Maven'
      run: mvn -V -ntp clean install -P full verify

